<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychological Pre-Screening Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .description {
            text-align: center;
            margin-bottom: 30px;
            color: #7f8c8d;
        }
        .question {
            margin-bottom: 25px;
            padding: 15px;
            background-color: #f9f9f9;
            border-left: 4px solid #3498db;
            border-radius: 4px;
        }
        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }
        .options label {
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        button {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        #result-area {
            display: none;
            margin-top: 30px;
            padding: 20px;
            background-color: #ecf0f1;
            border-radius: 10px;
        }
        .bar-container {
            margin-bottom: 15px;
        }
        .bar-label {
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        .bar-bg {
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
            height: 20px;
        }
        .bar-fill {
            height: 100%;
            transition: width 1s ease-in-out;
            width: 0%;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Pre-Screening Test</h1>
    <p class="description">Please answer the statements below by considering your condition over the past week.</p>

    <form id="survey-form">
        <!-- Questions are loaded here by JavaScript -->
    </form>

    <button type="button" onclick="analyzeResults()">Analyze Results</button>

    <div id="result-area">
        <h2>AI Analysis Result</h2>
        <div id="charts"></div>
    </div>
</div>

<script>
    // Real DASS-42 Depression Questions
    const questions = [
        { id: 'Q3A', text: "I felt that I could not experience any positive emotions." },
        { id: 'Q5A', text: "I found it very difficult to get myself to start doing anything." },
        { id: 'Q10A', text: "I felt that there was nothing hopeful about the future." },
        { id: 'Q13A', text: "I felt sad and downhearted." },
        { id: 'Q16A', text: "I felt that I had lost interest in almost everything." },
        { id: 'Q17A', text: "I felt like I was a worthless person." },
        { id: 'Q21A', text: "I felt that life was not worth living." },
        { id: 'Q24A', text: "I did not enjoy anything I did." },
        { id: 'Q26A', text: "I felt gloomy and depressed." },
        { id: 'Q31A', text: "I felt unable to become enthusiastic about anything." },
        { id: 'Q34A', text: "I felt like a very insignificant person." },
        { id: 'Q37A', text: "I could not see any reason to feel hopeful about the future." },
        { id: 'Q38A', text: "I felt that life was meaningless." },
        { id: 'Q42A', text: "I found it hard to take initiative to do things." }
    ];

    const form = document.getElementById('survey-form');

    // Render questions on the page
    questions.forEach((question, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.className = 'question';
        questionDiv.innerHTML = `
            <p><strong>${index + 1}.</strong> ${question.text}</p>
            <div class="options">
                <label><input type="radio" name="${question.id}" value="1" required checked> Not at all</label>
                <label><input type="radio" name="${question.id}" value="2"> A little</label>
                <label><input type="radio" name="${question.id}" value="3"> Quite a bit</label>
                <label><input type="radio" name="${question.id}" value="4"> Very much</label>
            </div>
        `;
        form.appendChild(questionDiv);
    });

    async function analyzeResults() {
        const payload = {};
        let missingAnswer = false;

        // Collect all answers
        questions.forEach(question => {
            const selected = document.querySelector(`input[name="${question.id}"]:checked`);
            if (selected) {
                payload[question.id] = parseInt(selected.value);
            } else {
                missingAnswer = true;
            }
        });

        if (missingAnswer) {
            alert("Please answer all questions!");
            return;
        }

        try {
            // Send data to FastAPI
            const response = await fetch('http://127.0.0.1:8000/api/calculate_risk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();
            displayResults(data.analysis_results);
        } catch (error) {
            alert("Unable to reach the server. Please make sure the API is running.");
            console.error(error);
        }
    }

    function displayResults(results) {
        document.getElementById('result-area').style.display = 'block';
        const chartsArea = document.getElementById('charts');
        chartsArea.innerHTML = '';

        // Colors and labels
        const metrics = [
            { key: 'normal_probability', label: 'Normal / Healthy', color: '#2ecc71' },
            { key: 'mild_risk_probability', label: 'Mild Risk', color: '#f1c40f' },
            { key: 'moderate_risk_probability', label: 'Moderate Risk', color: '#e67e22' },
            { key: 'severe_risk_probability', label: 'Severe Risk', color: '#e74c3c' },
            { key: 'very_severe_risk_probability', label: 'Very Severe Risk', color: '#8e44ad' }
        ];

        // Create a bar for each result
        metrics.forEach(metric => {
            const percentage = results[metric.key];
            const barHTML = `
                <div class="bar-container">
                    <div class="bar-label">
                        <span>${metric.label}</span>
                        <span>%${percentage}</span>
                    </div>
                    <div class="bar-bg">
                        <div class="bar-fill" style="width: ${percentage}%; background-color: ${metric.color};"></div>
                    </div>
                </div>
            `;
            chartsArea.innerHTML += barHTML;
        });

        // Smoothly scroll the page down to the results
        document.getElementById('result-area').scrollIntoView({ behavior: 'smooth' });
    }
</script>

</body>
</html>
